<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F0E9" />
  <title>CRM Portal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>CRM</span>
      </div>
      <nav class="segmented" id="segmented" role="tablist" hidden>
        <button class="seg active" data-view="dashboard" role="tab">Dashboard</button>
        <button class="seg" data-view="growth" role="tab">Groei</button>
        <button class="seg" data-view="customers" role="tab">Klanten</button>
      </nav>
      <button class="btn-primary" id="newCustomerBtn" hidden>+ Nieuwe klant</button>
      <button class="btn-ghost" id="logoutBtn" hidden>Uitloggen</button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="loading" id="loading">Laden…</div>
  </main>

  <!-- Sheet (modal) -->
  <div class="scrim" id="scrim" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
